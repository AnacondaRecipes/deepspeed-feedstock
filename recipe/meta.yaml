{% set name = "deepspeed" %}
{% set version = "0.19.5" %}
{% set build = 0 %}

# Higher build number for CUDA variants so the solver prefers them on GPU systems.
{% if cuda_compiler_version != "None" %}
{% set build = build + 200 %}
{% endif %}

# Match the pytorch build_string convention on pkgs/main:
#   CPU  -> pytorch * cpu_*
#   CUDA -> pytorch * gpu_cuda{NN}_*
# (the *cuda{NN}* substring match works because cuda{NN} is unique within the build_string)
{% if cuda_compiler_version == "None" %}
{% set torch_proc_type = "cpu" %}
{% else %}
{% set torch_proc_type = "cuda" + cuda_compiler_version | replace('.', '') %}
{% endif %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8dc5d32604a3c7a713b3d14de482533bd328ffebe716cdafcc3511953fc90cdf
  patches:
    # Handle None cpu_info['arch'] on aarch64 (py-cpuinfo returns arch=None there).
    - patches/0001-handle-none-cpu-arch.patch
    # 0002 (installed_cuda_version no-raise) dropped: upstream 0.19.x fixed the
    # runtime-only-CUDA import/ds_report crash via probe_is_compatible() (GH #7452).

build:
  number: {{ build }}
  string: cuda{{ cuda_compiler_version | replace('.', '') }}py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [cuda_compiler_version != "None"]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                # [cuda_compiler_version == "None"]
  # Upstream supports Linux primarily; Windows is unmaintained, macOS x86_64 has no
  # pytorch build to match. macOS arm64 is allowed (CPU only).
  skip: true  # [win or (osx and x86_64)]
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - {{ compiler('cuda') }}                    # [cuda_compiler_version != "None"]
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    # CUDA dev libs only needed in build for cross-compile; native builds get them from host.
    - cuda-cudart-dev    # [build_platform != target_platform and cuda_compiler_version != "None"]
    - libcublas-dev      # [build_platform != target_platform and cuda_compiler_version != "None"]
    - libcurand-dev      # [build_platform != target_platform and cuda_compiler_version != "None"]
    - libcusolver-dev    # [build_platform != target_platform and cuda_compiler_version != "None"]
    - libcusparse-dev    # [build_platform != target_platform and cuda_compiler_version != "None"]
    - cuda-profiler-api  # [build_platform != target_platform and cuda_compiler_version != "None"]
  host:
    - python
    - pip
    - setuptools
    # pybind11 headers required for op compilation (csrc/) — torch's extension.h
    # includes <pybind11/pybind11.h> directly. pytorch 2.13 vendors pybind11 3.x,
    # so match its host pin + propagate the pybind11-abi ==11 run_export for ABI safety.
    - pybind11 >=3.0.1,<4
    - pybind11-abi ==11
    # Needed for the async_io op (csrc/aio compilation under DS_BUILD_OPS=1);
    # propagates to run via libaio's run_exports — harmless on CPU builds.
    - libaio {{ libaio }}                       # [linux]
    # CUDA op compilation deps (csrc/, op_builder/) — see DeepSpeed setup.py.
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    # cuda-cudart-dev brings cuda-cudart at runtime via run_exports (compiled
    # ops link libcudart.so directly via -lcudart in extra_ldflags).
    - cuda-cudart-dev                           # [cuda_compiler_version != "None"]
    - libcublas-dev                             # [cuda_compiler_version != "None"]
    - libcurand-dev                             # [cuda_compiler_version != "None"]
    - libcusolver-dev                           # [cuda_compiler_version != "None"]
    - libcusparse-dev                           # [cuda_compiler_version != "None"]
    - cuda-profiler-api                         # [cuda_compiler_version != "None"]
    # oneCCL is Intel x86_64-only; needed for the CCL comm op (op_builder/cpu/comm.py).
    # On linux-aarch64 CUDA we skip the CCL op via DS_BUILD_CCL_COMM=0 in build.sh.
    - oneccl-devel                              # [cuda_compiler_version != "None" and x86_64]
    - pytorch =2.13.*=*{{ torch_proc_type }}*
  run:
    - python
    - einops
    - hjson-py
    - msgpack-python
    # ninja: DeepSpeed JIT-compiles ops at runtime via torch cpp_extension;
    # listed in upstream install_requires since 0.19.x.
    - ninja
    - numpy
    - packaging >=20.0
    - psutil
    - py-cpuinfo
    - pydantic >=2.0.0
    - pytorch =2.13.*=*{{ torch_proc_type }}*
    - tqdm
    # CUDA-only run deps. __cuda gates installation to GPU systems only;
    # cuda-version pins the runtime CUDA major to match what we built against.
    - __cuda                                    # [cuda_compiler_version != "None"]
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    - nvidia-ml-py                              # [cuda_compiler_version != "None"]
  run_constrained:
    # Optional-extras users commonly pull in alongside deepspeed. Constraining keeps
    # the solver from picking incompatible versions if these are co-installed.
    - transformers >=4.32.1     # `inf` extra
    - diffusers >=0.25.0        # `sd` extra
    - safetensors               # `inf` extra
    - sentencepiece             # `inf` extra
    - scipy                     # `deepcompile` extra
    - mpi4py                    # `1bit-mpi` extra

test:
  imports:
    - deepspeed
  requires:
    - pip
    - ninja
  commands:
    - pip check
    - ds_report
    - deepspeed --help

about:
  home: https://www.deepspeed.ai
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: DeepSpeed library for distributed training and inference acceleration
  description: |
    DeepSpeed is a deep learning optimization library that makes distributed
    training and inference easy, efficient, and effective. It enables
    world-class training speed, memory efficiency, scalability, and
    accessibility for large model training and inference.
  doc_url: https://www.deepspeed.ai/getting-started/
  dev_url: https://github.com/deepspeedai/DeepSpeed

extra:
  recipe-maintainers:
    - loadams
    - weiji14
    - sdvillal
